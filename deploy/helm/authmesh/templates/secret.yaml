{{- if not .Values.secrets.existingSecret }}
{{- /*
Secret values are resolved in this order:
  1. explicit value in values.yaml
  2. the value already stored in the cluster (so `helm upgrade` does not rotate
     the JWT secret and sign every user out, or orphan encrypted TOTP secrets)
  3. a freshly generated random value

`lookup` returns nothing during `helm template` or `--dry-run`, which is why a
rendered manifest shows different values each time; that is expected.
*/}}
{{- $secretName := printf "%s-secrets" (include "authmesh.fullname" .) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- $existingData := dict }}
{{- if $existing }}
{{- $existingData = $existing.data }}
{{- end }}

{{- $jwtSecret := .Values.secrets.jwtSecret }}
{{- if not $jwtSecret }}
{{- $jwtSecret = (get $existingData "JWT_SECRET" | b64dec | default (randAlphaNum 64)) }}
{{- end }}

{{- $totpKey := .Values.secrets.totpEncryptionKey }}
{{- if not $totpKey }}
{{- $totpKey = (get $existingData "TOTP_ENCRYPTION_KEY" | b64dec | default (randBytes 32)) }}
{{- end }}

{{- $pepper := .Values.secrets.recoveryCodePepper }}
{{- if not $pepper }}
{{- $pepper = (get $existingData "RECOVERY_CODE_PEPPER" | b64dec | default (randAlphaNum 48)) }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "authmesh.labels" . | nindent 4 }}
  annotations:
    # Keep the Secret when the release is deleted: dropping TOTP_ENCRYPTION_KEY
    # would make every enrolled second factor unreadable.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  JWT_SECRET: {{ $jwtSecret | quote }}
  {{- with .Values.secrets.jwtSecretPrevious }}
  JWT_SECRET_PREVIOUS: {{ . | quote }}
  {{- end }}
  TOTP_ENCRYPTION_KEY: {{ $totpKey | quote }}
  RECOVERY_CODE_PEPPER: {{ $pepper | quote }}
{{- end }}
