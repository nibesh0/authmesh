{{- /*
Horizontal Pod Autoscalers.

Requires metrics-server in the cluster; without it the HPA reports
"unknown" for the resource metrics and will not scale. Note the CPU target is
computed against the container's CPU *request*, which is why the requests in
values.yaml are sized to the real cost of a login rather than left at a token
value.
*/}}
{{- range $component := (list "gateway" "auth" "user") }}
{{- $cfg := index $.Values $component }}
{{- if and $cfg.enabled $cfg.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "authmesh.componentName" (dict "ctx" $ "component" $component) }}
  labels:
    {{- include "authmesh.componentLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "authmesh.componentName" (dict "ctx" $ "component" $component) }}
  minReplicas: {{ $cfg.autoscaling.minReplicas }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas }}
  metrics:
    {{- if $cfg.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $cfg.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $cfg.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
  {{- with $cfg.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
