{{- if .Values.mongodb.enabled }}
{{- $component := "mongodb" }}
{{- $name := include "authmesh.componentName" (dict "ctx" . "component" $component) }}
{{- /*
Single-replica MongoDB for development and demos.

This is not a production database: one replica means no failover and a restart is
a brief outage. For anything real, set mongodb.enabled=false and point
mongodb.externalUri at a replica set or a managed service.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "authmesh.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "authmesh.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "authmesh.componentLabels" (dict "ctx" . "component" $component) | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "authmesh.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "authmesh.componentLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The upstream image ships a `mongodb` user with this uid.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
          args:
            - --bind_ip_all
            # WiredTiger sizes its cache from host RAM and ignores the container
            # limit, so an explicit cap is required or the pod gets OOMKilled.
            - --wiredTigerCacheSizeGB={{ .Values.mongodb.wiredTigerCacheSizeGB }}
          ports:
            - name: mongodb
              containerPort: 27017
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/db
      {{- if not .Values.mongodb.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.mongodb.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.mongodb.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongodb.persistence.size }}
  {{- end }}
{{- end }}
