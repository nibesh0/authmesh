[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "authmesh-user-service"
version = "0.1.0"
description = "MongoDB-backed user and audit persistence service (gRPC)."
requires-python = ">=3.12"
dependencies = [
  "authmesh-common",
  "motor==3.7.0",
  "pymongo==4.11.3",
]

[project.scripts]
user-service = "user_service.main:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["user_service*"]
